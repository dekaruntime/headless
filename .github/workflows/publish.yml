name: Publish to npm

# Stage three of the cascade. Fires on the tag that sync-wasm pushed.
#
# Publishing is the signal the next stage listens for: the AI worker depends on
# this package, so a new version here is what triggers its redeploy -- and the
# worker ships with the compiler baked in rather than fetching it at runtime.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC). The environment name must match the one
    # configured on the package at npmjs.com -- if it does not, the OIDC token's
    # audience will not match and the publish is rejected as unauthorised, which
    # reads like a permissions bug rather than a name typo.
    environment: headless
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. The npm bundled with Node 22 is
      # older, and an older client silently falls back to looking for a token --
      # which then fails with EOTP or ENEEDAUTH instead of naming the real cause.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Test
        run: node --test test/*.test.mjs

      - name: Verify the committed wasm matches its pin
        run: |
          set -euo pipefail
          pinned=$(grep -oP "sha256: '\K[0-9a-f]{64}" src/wasm-info.js)
          actual=$(sha256sum wasm/deka_compiler.wasm | cut -d' ' -f1)
          [ "$pinned" = "$actual" ] || { echo "pin/bytes mismatch -- refusing to publish"; exit 1; }

      # The tag and package.json must agree, or the dist-tag mapping recorded
      # below points at the wrong release.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package.json $pkg"; exit 1; }

      - name: Resolve the runtime this build carries
        id: rt
        run: |
          echo "version=$(grep -oP "releaseVersion: '\K[^']+" src/wasm-info.js)" >> "$GITHUB_OUTPUT"

      - name: Pack (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          npm pack --dry-run
          echo "Would publish under dist-tags: latest, deka-${{ steps.rt.outputs.version }}"

      # No NODE_AUTH_TOKEN. Authentication is the OIDC token minted by GitHub for
      # this workflow in this environment, exchanged by npm for a short-lived
      # credential. Nothing long-lived is stored anywhere, which is the point:
      # npm is phasing out tokens that bypass 2FA.
      - name: Publish
        if: github.event.inputs.dry_run != 'true'
        run: npm publish --access public

      # The mapping from package version to the runtime it compiles for. This is
      # what makes `npm i @dekaruntime/headless@deka-0.29.0` resolve, so a
      # consumer can pin the compiler rather than the wrapper.
      - name: Tag the runtime version
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          npm dist-tag add "@dekaruntime/headless@${pkg}" "deka-${{ steps.rt.outputs.version }}"
          npm dist-tag ls @dekaruntime/headless
